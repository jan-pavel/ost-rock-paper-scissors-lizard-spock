<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Schere Stein Papier</title>
  <link rel="stylesheet" href="styles/global.css">
  <script src="scripts/main.js" type="module"></script>
</head>

<body>
  <h1>Schere Stein Papier</h1>
  <section id="start-page">
    <h2>Lokale Rangliste</h2>
    <div id="ranking"></div>
    <hr />
    <form id="start-form">
      <p>Starten Sie ein neues Spiel</p>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" maxlength="20" required />
      <button type="submit">Spiel starten</button>
    </form>
  </section>

  <section id="game-page" hidden>
    <p id="player-name"></p>
    <button data-hand="Rock">Rock</button>
    <button data-hand="Paper">Paper</button>
    <button data-hand="Scissors">Scissors</button>
    <button data-hand="Lizard">Lizard</button>
    <button data-hand="Spock">Spock</button>
    <p>Deine Wahl: <span id="player-hand"></span></p>
    <p>Wahl des Computers: <span id="system-hand"></span></p>
    <p>Gewonnen hat: <span id="result"></span></p>
    <p id="countdown"></p>

    <button id="back-button">Zurück zur Startseite</button>

    <hr />
    <table>
      <caption>History</caption>
      <thead>
        <tr>
          <th>Resultat</th>
          <th>Spieler</th>
          <th>Gegner</th>
        </tr>
      </thead>
      <tbody id="history">

      </tbody>

    </table>

  </section>
</body>

</html>
